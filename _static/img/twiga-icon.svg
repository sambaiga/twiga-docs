<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="#1C2429" stroke="#00BFA5" stroke-width="1.5"/>

  <!-- Ossicones -->
  <line x1="24" y1="10" x2="22" y2="4"  stroke="#00BFA5" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="9"  x2="31" y2="3"  stroke="#00BFA5" stroke-width="2" stroke-linecap="round"/>

  <!-- Head -->
  <ellipse cx="26" cy="14" rx="9" ry="7" fill="#00BFA5"/>
  <!-- Snout -->
  <ellipse cx="32" cy="16" rx="4" ry="3" fill="#00BFA5"/>
  <!-- Eye -->
  <circle cx="28" cy="12" r="1.8" fill="#1C2429"/>
  <circle cx="28.6" cy="11.5" r="0.5" fill="#F8FAFC"/>

  <!-- Neck -->
  <path d="M19 20 L16 48 L30 48 L28 20 Z" fill="#00BFA5"/>
  <!-- Neck spots -->
  <ellipse cx="23" cy="30" rx="3" ry="3.5" fill="#1C2429" opacity="0.3"/>
  <ellipse cx="24" cy="41" rx="2.5" ry="3" fill="#1C2429" opacity="0.25"/>

  <!-- Body -->
  <ellipse cx="40" cy="50" rx="14" ry="10" fill="#00BFA5"/>
  <!-- Body spots -->
  <ellipse cx="37" cy="46" rx="3.5" ry="2.5" fill="#1C2429" opacity="0.25"/>
  <ellipse cx="45" cy="52" rx="3" ry="2.5" fill="#1C2429" opacity="0.22"/>

  <!-- Tail -->
  <path d="M53 49 Q58 46 56 57" stroke="#00BFA5" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="56" cy="57" r="1.5" fill="#00BFA5"/>

  <!-- Legs -->
  <rect x="23" y="57" width="5" height="7" rx="2.5" fill="#00BFA5"/>
  <rect x="30" y="57" width="5" height="6" rx="2.5" fill="#00BFA5"/>
  <rect x="38" y="57" width="5" height="6" rx="2.5" fill="#00BFA5"/>
  <rect x="45" y="57" width="5" height="7" rx="2.5" fill="#00BFA5"/>
</svg>
