<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 72" fill="none">

  <!-- ── Giraffe icon ─────────────────────────────────────────── -->
  <g>
    <!-- Ossicones -->
    <line x1="19" y1="7"  x2="17" y2="1"  stroke="#0f718e" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="26" y1="6"  x2="27" y2="0"  stroke="#0f718e" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Head -->
    <ellipse cx="22" cy="11" rx="9" ry="7" fill="#069fac"/>
    <!-- Snout -->
    <ellipse cx="28" cy="13" rx="4" ry="3" fill="#069fac"/>
    <!-- Eye -->
    <circle cx="24" cy="9" r="1.8" fill="#fff"/>
    <circle cx="24.6" cy="8.5" r="0.7" fill="#1C2429"/>
    <!-- Neck -->
    <path d="M16 17 L13 52 L28 52 L26 17 Z" fill="#069fac"/>
    <!-- Neck spots -->
    <ellipse cx="20" cy="30" rx="3.5" ry="4"   fill="#0f718e" opacity="0.35"/>
    <ellipse cx="22" cy="41" rx="3"   ry="3.5" fill="#0f718e" opacity="0.3"/>
    <!-- Body -->
    <ellipse cx="36" cy="54" rx="16" ry="11" fill="#069fac"/>
    <!-- Body spots -->
    <ellipse cx="32" cy="50" rx="4"   ry="3"   fill="#0f718e" opacity="0.3"/>
    <ellipse cx="42" cy="55" rx="3.5" ry="3"   fill="#0f718e" opacity="0.28"/>
    <ellipse cx="34" cy="58" rx="3"   ry="2.5" fill="#0f718e" opacity="0.25"/>
    <!-- Tail -->
    <path d="M51 53 Q57 50 55 62" stroke="#069fac" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="55" cy="62" r="1.8" fill="#069fac"/>
    <!-- Legs -->
    <rect x="21" y="62" width="5.5" height="18" rx="2.75" fill="#069fac"/>
    <rect x="29" y="62" width="5.5" height="16" rx="2.75" fill="#069fac"/>
    <rect x="39" y="62" width="5.5" height="16" rx="2.75" fill="#069fac"/>
    <rect x="47" y="62" width="5.5" height="18" rx="2.75" fill="#069fac"/>
    <!-- Hooves -->
    <rect x="21" y="77" width="5.5" height="3" rx="1.5" fill="#0f718e"/>
    <rect x="29" y="75" width="5.5" height="3" rx="1.5" fill="#0f718e"/>
    <rect x="39" y="75" width="5.5" height="3" rx="1.5" fill="#0f718e"/>
    <rect x="47" y="77" width="5.5" height="3" rx="1.5" fill="#0f718e"/>
  </g>

  <!-- ── Wordmark (dark text for light backgrounds) ──────────── -->
  <text x="68" y="34"
        font-family="Poppins, 'Segoe UI', sans-serif"
        font-weight="700"
        font-size="26"
        letter-spacing="-0.5"
        fill="#1C2429">Twiga</text>
  <text x="70" y="54"
        font-family="Lato, 'Helvetica Neue', sans-serif"
        font-weight="300"
        font-size="13"
        letter-spacing="4"
        fill="#0f718e">FORECAST</text>

</svg>
